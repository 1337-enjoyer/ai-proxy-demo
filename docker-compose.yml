services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider_pass
      POSTGRES_DB: ai_provider
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provider"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://provider:provider_pass@db:5432/ai_provider
      OPENAI_BASE_URL: http://host.docker.internal:8011/v1
      OPENAI_API_KEY: test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --reload

volumes:
  pgdata: